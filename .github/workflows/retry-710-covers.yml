name: Phase 2B - Retry 710 Quota-Throttled Covers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retry-covers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyMuPDF & BeautifulSoup4
        run: pip install --quiet pymupdf beautifulsoup4

      - name: Retry 710 throttled cover uploads
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: python -u scripts/cloud_collect_missing_covers.py --skip-rokomari --only-book-ids data/retry_710_book_ids.json --workers 4

      - name: Commit retry shard result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cover_shards/shard_00.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(covers): record 710 cover retry results"
            git pull --rebase origin main && git push
          fi
