name: Ingest Books from students.bd

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max books per run (0 = all remaining up to 300 min)"
        required: false
        default: "250"
      workers:
        description: "Concurrent download/upload workers"
        required: false
        default: "6"
      auto_continue:
        description: "Automatically chain next run if books remain"
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  actions: write

jobs:
  ingest-students-bd:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install google-auth if using Service Account
        if: ${{ env.HAS_SA == 'true' }}
        env:
          HAS_SA: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON != '' }}
        run: pip install google-auth

      - name: Verify Drive credentials secret is configured
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GDRIVE_OAUTH_JSON" ] && [ -z "$GDRIVE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing secret. Add GDRIVE_OAUTH_JSON (with client_id, client_secret, refresh_token) or GDRIVE_SERVICE_ACCOUNT_JSON in Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Collect books from students.bd and upload to Google Drive
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          python scripts/collect_students_bd.py \
            --limit "${{ inputs.limit }}" \
            --workers "${{ inputs.workers }}" \
            --max-minutes 300

      - name: Rebuild GitHub catalog, READMEs, and books.json
        if: always()
        run: |
          python scripts/collect_students_bd.py --merge-only
          python scripts/rebuild_github_clean_repo.py

      - name: Commit and push updated library
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat: ingest books from students.bd to Drive and GitHub catalog"
            git pull --rebase
            git push
          fi

      - name: Chain next batch if books remain
        if: ${{ success() && inputs.auto_continue }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMAINING=$(python -c '
          import json
          from pathlib import Path
          cat = json.loads(Path("data/students_bd_catalog.json").read_text(encoding="utf-8"))
          prog = json.loads(Path("data/students_bd_progress.json").read_text(encoding="utf-8")) if Path("data/students_bd_progress.json").exists() else {}
          print(sum(1 for it in cat if it["slug"] not in prog))
          ')
          echo "Remaining books: $REMAINING"
          if [ "$REMAINING" -gt 0 ]; then
            gh workflow run ingest-students-bd.yml \
              -f limit="${{ inputs.limit }}" \
              -f workers="${{ inputs.workers }}" \
              -f auto_continue=true
          fi
