name: "Library Organization (Safe Renames, Banglish, Author Subfolders & Drive Shortcuts)"

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to execute on live Google Drive"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - safe_renames
          - banglish_renames
          - author_subfolders
          - cross_category_shortcuts
          - series_shortcuts
          - move_non_pdf
          - sync_catalog

permissions:
  contents: write

concurrency:
  group: library-organization
  cancel-in-progress: false

jobs:
  organize-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute Drive Organization (${{ inputs.stage }})
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: |
          STAGE="${{ inputs.stage }}"
          if [ "$STAGE" = "all" ] || [ "$STAGE" = "safe_renames" ]; then
            python -u scripts/apply_safe_renames_and_banglish.py --mode safe_renames --repo-dir .
          fi
          if [ "$STAGE" = "all" ] || [ "$STAGE" = "banglish_renames" ]; then
            python -u scripts/apply_safe_renames_and_banglish.py --mode banglish_renames --repo-dir .
          fi
          if [ "$STAGE" = "all" ] || [ "$STAGE" = "author_subfolders" ]; then
            python -u scripts/author_subfolder_organizer.py --repo-dir .
          fi
          if [ "$STAGE" = "all" ] || [ "$STAGE" = "cross_category_shortcuts" ]; then
            python -u scripts/cross_category_shortcut_organizer.py --repo-dir .
          fi
          if [ "$STAGE" = "series_shortcuts" ]; then
            python -u scripts/organize_all_series_shortcuts.py
            python -u scripts/sync_catalog_from_drive.py --repo-dir .
          fi
          if [ "$STAGE" = "move_non_pdf" ]; then
            python -u scripts/move_non_pdf_to_unclassified.py --repo-dir .
            python -u scripts/sync_catalog_from_drive.py --repo-dir .
          fi
          if [ "$STAGE" = "all" ] || [ "$STAGE" = "sync_catalog" ]; then
            python -u scripts/sync_catalog_from_drive.py --repo-dir .
          fi

      - name: Upload Organization Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-organization-reports-${{ inputs.stage }}
          path: |
            reports/
            Library Management/Reports/
          retention-days: 30

      - name: Commit reports, changelog, and updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ books.json visualize/public/books.json visualize/public/series_catalog.json "Library Management/Reports/"
          if git diff --staged --quiet; then
            echo "No repository changes to commit."
          else
            git commit -m "chore(library): execute ${{ inputs.stage }} Drive organization & catalog sync"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                break
              fi
              echo "Push attempt $attempt failed; retrying in 5s..."
              sleep 5
            done
          fi
