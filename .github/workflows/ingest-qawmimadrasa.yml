name: Ingest Qawmi Madrasa Books (All Sources + Covers + Category Map)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max books per run (0 = all remaining up to max_minutes)"
        required: false
        default: "0"
      workers:
        description: "Concurrent download/upload workers"
        required: false
        default: "8"
      max_minutes:
        description: "Graceful stop after N minutes"
        required: false
        default: "300"
      include_arabic_2444:
        description: "Include 2,444 Arabic Reference Library books"
        type: boolean
        required: false
        default: true
      auto_continue:
        description: "Automatically chain next run if books remain"
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: qawmimadrasa-ingest
  cancel-in-progress: false

jobs:
  ingest-qawmimadrasa:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests beautifulsoup4 pymupdf openpyxl

      - name: Verify GDRIVE_OAUTH_JSON secret
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: |
          if [ -z "$GDRIVE_OAUTH_JSON" ]; then
            echo "::error::Missing GDRIVE_OAUTH_JSON secret."
            exit 1
          fi

      - name: Collect books & covers from all 3 sites and upload to Google Drive
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: |
          ARGS="--limit ${{ inputs.limit || '0' }} --workers ${{ inputs.workers || '8' }} --max-minutes ${{ inputs.max_minutes || '300' }}"
          if [ "${{ inputs.include_arabic_2444 }}" != "true" ]; then
            ARGS="$ARGS --no-arabic"
          fi
          python -u scripts/collect_qawmimadrasa.py $ARGS

      - name: Commit and push progress, summary, and category map spreadsheet
        id: commit_push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add \
              data/qawmimadrasa_folders.json \
              data/qawmimadrasa_catalog.json \
              data/qawmimadrasa_progress.json \
              reports/qawmimadrasa_summary.json \
              reports/00_Qawmi_Madrasa_Category_Map_and_Book_Catalog.xlsx \
              reports/00_Qawmi_Madrasa_Category_Map_and_Book_Catalog.csv 2>/dev/null || true
            if git diff --staged --quiet; then
              echo "No changes to commit."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              break
            fi
            git commit -m "chore(qawmi): sync Qawmi Madrasa ingestion progress, covers & category map"
            if git pull --rebase origin main && git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done

      - name: Chain next batch if books remain
        if: ${{ success() && inputs.auto_continue && steps.commit_push.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMAINING=$(python -c '
          import json
          from pathlib import Path
          cat = json.loads(Path("data/qawmimadrasa_catalog.json").read_text(encoding="utf-8"))
          prog = json.loads(Path("data/qawmimadrasa_progress.json").read_text(encoding="utf-8")) if Path("data/qawmimadrasa_progress.json").exists() else {}
          print(sum(1 for it in cat if it["key"] not in prog))
          ')
          echo "Remaining items: $REMAINING"
          if [ "$REMAINING" -gt 0 ]; then
            gh workflow run ingest-qawmimadrasa.yml \
              -f limit="${{ inputs.limit || '0' }}" \
              -f workers="${{ inputs.workers || '8' }}" \
              -f max_minutes="${{ inputs.max_minutes || '300' }}" \
              -f include_arabic_2444="${{ inputs.include_arabic_2444 }}" \
              -f auto_continue=true
          fi
