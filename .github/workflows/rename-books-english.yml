name: Rename Drive Books to English

on:
  workflow_dispatch:
    inputs:
      category:
        description: "Optional top_category filter (leave empty for all categories)"
        required: false
        default: ""
      dry_run:
        description: "Preview only without renaming in Google Drive"
        type: boolean
        required: false
        default: false
      workers:
        description: "Concurrent API workers"
        required: false
        default: "12"

permissions:
  contents: write

jobs:
  rename-books-english:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install google-auth if using Service Account
        if: ${{ env.HAS_SA == 'true' }}
        env:
          HAS_SA: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON != '' }}
        run: pip install google-auth

      - name: Verify Drive credentials secret is configured
        if: ${{ !inputs.dry_run }}
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GDRIVE_OAUTH_JSON" ] && [ -z "$GDRIVE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing secret. Add GDRIVE_OAUTH_JSON (with client_id, client_secret, refresh_token) or GDRIVE_SERVICE_ACCOUNT_JSON in Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Run English rename script
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          ARGS="--workers ${{ inputs.workers }}"
          if [ -n "${{ inputs.category }}" ]; then
            ARGS="$ARGS --category \"${{ inputs.category }}\""
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          eval python scripts/rename_books_english.py $ARGS

      - name: Commit and push rename progress state
        if: always() && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/english_rename_state.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update English Drive rename progress state"
            git push
          fi
