name: "Education & Textbooks Master Organization & Legal Expansion"

on:
  workflow_dispatch:
    inputs:
      skip_reorg:
        description: "Skip Phase 1-2 reorg if already completed on Drive"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: library-drive-write
  cancel-in-progress: false

jobs:
  organize-and-expand:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip openpyxl Pillow

      - name: Phase 1-2 — Organize existing Education & Textbooks (Qawmi Madrasa off-limits)
        if: ${{ inputs.skip_reorg != true }}
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: python -u scripts/cloud_organize_education.py

      - name: Phase 3-6 — Legal multi-source expansion, Index & Catalog/GitHub sync
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: python -u scripts/cloud_expand_education_library.py

      - name: Commit & push updated catalogs, reports, books.json & 9-folder mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "Education & Textbooks" "Bangla Books" "English Books" "Religion Books" "Authors & Scholars" "Series & Collections" "Reference & Research" "Review & Unclassified" "Library Management"
          git add catalog/ reports/Educational_Library_Index.csv reports/Educational_Library_Index.xlsx reports/education_reorg_report.json reports/education_expansion_report.json reports/verification_report.md reports/verification_report.json README.md website/README.md sitemap.xml books.json
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git commit -m "chore(education): organize Education & Textbooks, expand open-access collection & sync catalog [skip ci]"
          git pull --rebase origin main || true
          git push origin main
