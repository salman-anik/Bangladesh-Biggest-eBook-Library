name: Sync Books to Google Drive

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: "Maximum number of books to copy in this run"
        required: false
        default: "2000"
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-api-python-client google-auth

      - name: Copy remaining books to Google Drive
        if: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON != '' }}
        env:
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          MAX_ITEMS_PER_RUN: ${{ github.event.inputs.max_items || '2000' }}
        run: python scripts/sync_drive_and_catalog.py

      - name: Notice if secret is not configured
        if: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON == '' }}
        run: |
          echo "GDRIVE_OAUTH_TOKEN_JSON secret is not set yet. Skipping Drive copy and regenerating catalog only."

      - name: Regenerate README, category indexes, and books.json
        run: python scripts/generate_library.py

      - name: Commit and push updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/catalog_progress.json README.md categories/ books.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update e-book library catalog and Drive sync progress"
            git push
          fi
