name: Rebuild Library Catalog & Explorer

on:
  workflow_dispatch:
  # Legacy weekly cron replaced by library-verify-sync.yml
  # schedule:
  #   - cron: "0 0 * * 0"

permissions:
  contents: write

jobs:
  rebuild-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild clean category READMEs, books.json, and sitemap
        run: python scripts/build_merged_github_and_report.py

      - name: Build interactive visualizer app
        run: |
          cd visualize
          npm ci || npm install
          npm run build

      - name: Commit and push updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: rebuild unified e-book catalog and explorer"
            git push
          fi
