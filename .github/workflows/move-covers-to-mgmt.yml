name: Consolidate All Covers into Library Management Cover Images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-covers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Move all Qawmi covers to Library Management/Cover Images
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: python -u scripts/cloud_move_covers.py

      - name: Commit cover consolidation summary
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cloud_move_covers_result.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(covers): consolidate all book covers into Library Management/Cover Images"
            git pull --rebase origin main && git push
          fi
