name: Fast Drive Reorganization (English Books + Qawmi Madrasa)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fast-reorg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute fast REST API reorganization
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: python -u scripts/cloud_fast_reorg.py

      - name: Commit result summary
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cloud_fast_reorg_result.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(reorg): record fast cloud reorganization summary"
            git pull --rebase origin main && git push
          fi
