name: Ingest Extra Drive Folders & Web Books

on:
  # Disabled weekly cron so legacy romanized ingester cannot revert Bangla library organization
  # schedule:
  #   - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max books per run (0 = all remaining up to 300 min)"
        required: false
        default: "1000"
      workers:
        description: "Concurrent workers"
        required: false
        default: "12"
      auto_continue:
        description: "Automatically chain next run if books remain"
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: ebook-library-ingest
  cancel-in-progress: false

jobs:
  ingest-extra-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify GDRIVE_OAUTH_JSON secret
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: |
          if [ -z "$GDRIVE_OAUTH_JSON" ]; then
            echo "::error::Missing GDRIVE_OAUTH_JSON secret."
            exit 1
          fi

      - name: Collect Drive folders & web PDFs
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
        run: |
          python scripts/collect_extra_sources.py \
            --refresh-web \
            --limit "${{ inputs.limit || '1000' }}" \
            --workers "${{ inputs.workers || '12' }}" \
            --max-minutes 300

      - name: Merge, rebuild catalog, and push to main
        id: commit_push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git checkout -- data/merged_books.json 2>/dev/null || true
            git pull --rebase origin main || { git rebase --abort 2>/dev/null || true; git pull --no-rebase -X theirs origin main; }
            python scripts/collect_extra_sources.py --merge-only
            [ -f scripts/collect_students_bd.py ] && python scripts/collect_students_bd.py --merge-only || true
            python scripts/build_merged_github_and_report.py
            git add -A
            if git diff --staged --quiet; then
              echo "No changes to commit."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              break
            else
              git commit -m "feat: ingest extra Drive folders and web PDFs"
              if git push origin main; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                break
              fi
              echo "Push raced with another run (attempt $attempt), retrying..."
              git reset --soft HEAD~1
            fi
          done

      - name: Chain next batch if books remain
        if: ${{ success() && (inputs.auto_continue != false) && steps.commit_push.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMAINING=$(python -c '
          import json
          from pathlib import Path
          cat = json.loads(Path("data/extra_sources_catalog.json").read_text(encoding="utf-8"))
          prog = json.loads(Path("data/extra_sources_progress.json").read_text(encoding="utf-8")) if Path("data/extra_sources_progress.json").exists() else {}
          print(sum(1 for it in cat if it["id"] not in prog))
          ')
          echo "Remaining books: $REMAINING"
          if [ "$REMAINING" -gt 0 ]; then
            gh workflow run ingest-extra-sources.yml \
              -f limit="${{ inputs.limit || '1000' }}" \
              -f workers="${{ inputs.workers || '12' }}" \
              -f auto_continue=true
          fi
