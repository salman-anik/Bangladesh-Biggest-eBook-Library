name: Library Organizer & Automated Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0" # Every Sunday at 04:00 UTC

permissions:
  contents: write

jobs:
  organize-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests

      - name: Execute Library Pipeline (Scan, Extract, Duplicates, Index, Plan)
        run: |
          python main.py scan
          python main.py extract
          python main.py duplicates
          python main.py index
          python main.py plan

      - name: Run QA Verification
        run: |
          python main.py verify

      - name: Set up Node.js for Visualizer
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Next.js Visualizer
        run: |
          cd visualize
          npm ci || npm install
          npm run build

      - name: Commit and Push Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ config/
          if git diff --staged --quiet; then
            echo "No catalog changes to commit."
          else
            git commit -m "chore(sync): automated catalog and search index refresh [skip ci]"
            git push origin main
          fi
