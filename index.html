</head>
<body>
  <header>
    <h1>📚 Bangladesh's Biggest E-Book Library</h1>
    <p>বাংলাদেশের বৃহত্তম ই-বুক লাইব্রেরি — Search &amp; browse thousands of books by Category, Subcategory, Author, or Publication.</p>
    <div class="stats" id="stats">
      <span class="stat-pill">Loading catalog...</span>
    </div>
  </header>

  <main>
    <div class="controls">
      <input type="search" id="search" placeholder="Search title, author, publication, or category..." />
      <select id="authorFilter"><option value="ALL">All Authors</option></select>
      <select id="pubFilter"><option value="ALL">All Publications</option></select>
      <select id="sort">
        <option value="name">Sort: A → Z</option>
        <option value="size_desc">Sort: Largest First</option>
        <option value="size_asc">Sort: Smallest First</option>
      </select>
    </div>

    <div class="chips" id="chips"></div>
    <div id="results-info" style="color: var(--muted); font-size: 0.88rem; margin-bottom: 0.85rem;"></div>
    <div class="grid" id="grid"></div>
    <div class="pagination" id="pagination"></div>
  </main>

  <script>
    const PAGE_SIZE = 60;
    let allBooks = [];
    let filtered = [];
    let activeCategory = "ALL";
    let page = 1;

    function fmtSize(b) {
      if (!b) return "-";
      const u = ["B", "KB", "MB", "GB"];
      let i = 0;
      while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
      return (i === 0 ? b : b.toFixed(1)) + " " + u[i];
    }

    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }

    function applyFilters() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const author = document.getElementById("authorFilter").value;
      const pub = document.getElementById("pubFilter").value;
      const sort = document.getElementById("sort").value;

      filtered = allBooks.filter(b => {
        if (activeCategory !== "ALL" && b.top_category !== activeCategory) return false;
        if (author !== "ALL" && b.author !== author) return false;
        if (pub !== "ALL" && b.publication !== pub) return false;
        if (!q) return true;
        return (
          b.name.toLowerCase().includes(q) ||
          (b.author || "").toLowerCase().includes(q) ||
          (b.publication || "").toLowerCase().includes(q) ||
          (b.leaf_category || "").toLowerCase().includes(q) ||
          (b.subfolder || "").toLowerCase().includes(q)
        );
      });

      if (sort === "name") filtered.sort((a, b) => a.name.localeCompare(b.name));
      else if (sort === "size_desc") filtered.sort((a, b) => (b.size || 0) - (a.size || 0));
      else if (sort === "size_asc") filtered.sort((a, b) => (a.size || 0) - (b.size || 0));

      page = 1;
      render();
    }

    function render() {
      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      page = Math.min(page, totalPages);
      const start = (page - 1) * PAGE_SIZE;
      const slice = filtered.slice(start, start + PAGE_SIZE);

      document.getElementById("results-info").textContent =
        `Showing ${filtered.length === 0 ? 0 : start + 1}–${Math.min(start + PAGE_SIZE, filtered.length)} of ${filtered.length.toLocaleString()} books`;

      const grid = document.getElementById("grid");
      if (slice.length === 0) {
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1;">No books matched your search.</div>`;
      } else {
        grid.innerHTML = slice.map(b => {
          const covId = b.cover_file_id || b.cover_drive_id;
          const covUrl = covId ? `https://drive.google.com/file/d/${covId}/view` : (b.cover_url || "");
          const pdfId = b.pdf_file_id || b.epub_file_id;
          return `
          <div class="card">
            <div>
              <div class="card-title">${escapeHtml(b.name)}</div>
              <div class="card-meta" style="margin-top:0.45rem;">
                <span class="badge">${escapeHtml(b.leaf_path || b.top_category)}</span>
                <span>✍️ ${escapeHtml(b.author)}</span>
                <span>🏢 ${escapeHtml(b.publication)}</span>
              </div>
            </div>
            <div class="card-actions">
              <span class="size">${fmtSize(b.size)}</span>
              <div style="display:flex;gap:0.4rem;align-items:center;flex-wrap:wrap;">
                ${pdfId ? `<a class="btn" style="background:var(--surface-2);color:var(--text);" href="https://drive.google.com/file/d/${escapeHtml(pdfId)}/view" target="_blank" rel="noopener">eBook</a>` : ""}
                ${b.text_file_id ? `<a class="btn" style="background:var(--surface-2);color:var(--text);" href="https://drive.google.com/file/d/${escapeHtml(b.text_file_id)}/view" target="_blank" rel="noopener">Text</a>` : ""}
                ${covUrl ? `<a class="btn" style="background:var(--surface-2);color:var(--text);" href="${escapeHtml(covUrl)}" target="_blank" rel="noopener">Cover</a>` : ""}
                <a class="btn" href="${escapeHtml(b.link)}" target="_blank" rel="noopener">Folder ↗</a>
              </div>
            </div>
          </div>
        `;
        }).join("");
      }

      document.getElementById("pagination").innerHTML = `
        <button class="page-btn" ${page <= 1 ? "disabled" : ""} onclick="goPage(${page - 1})">← Previous</button>
        <span style="font-size:0.9rem;color:var(--muted);">Page ${page} / ${totalPages}</span>
        <button class="page-btn" ${page >= totalPages ? "disabled" : ""} onclick="goPage(${page + 1})">Next →</button>
      `;
    }

    window.goPage = function(p) {
      page = p;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    async function init() {
      const res = await fetch("books.json");
      allBooks = await res.json();

      const totalSize = allBooks.reduce((acc, b) => acc + (b.size || 0), 0);
      const cats = {};
      const authors = {};
      const pubs = {};
      allBooks.forEach(b => {
        const tc = b.top_category || b.category;
        cats[tc] = (cats[tc] || 0) + 1;
        if (b.author) authors[b.author] = (authors[b.author] || 0) + 1;
        if (b.publication) pubs[b.publication] = (pubs[b.publication] || 0) + 1;
      });

      document.getElementById("stats").innerHTML = `
        <span class="stat-pill">📖 ${allBooks.length.toLocaleString()} Books</span>
        <span class="stat-pill">🗂️ ${Object.keys(cats).length} Categories</span>
        <span class="stat-pill">✍️ ${Object.keys(authors).length.toLocaleString()} Authors</span>
        <span class="stat-pill">🏢 ${Object.keys(pubs).length} Publications</span>
        <span class="stat-pill">💾 ${fmtSize(totalSize)}</span>
        <a class="stat-pill" href="https://drive.google.com/drive/folders/1fMsplDtUnpUhnNBJGKvYQ1sdZx0QVJWq" target="_blank" rel="noopener">📁 Google Drive Root ↗</a>
      `;

      const authorSel = document.getElementById("authorFilter");
      Object.entries(authors).sort((a, b) => b[1] - a[1]).forEach(([name, cnt]) => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = `${name} (${cnt})`;
        authorSel.appendChild(opt);
      });

      const pubSel = document.getElementById("pubFilter");
      Object.entries(pubs).sort((a, b) => b[1] - a[1]).forEach(([name, cnt]) => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = `${name} (${cnt})`;
        pubSel.appendChild(opt);
      });

      const chipsEl = document.getElementById("chips");
      const allChip = `<button class="chip active" data-cat="ALL">All (${allBooks.length.toLocaleString()})</button>`;
      const catChips = Object.keys(cats).sort().map(c =>
        `<button class="chip" data-cat="${escapeHtml(c)}">${escapeHtml(c)} (${cats[c].toLocaleString()})</button>`
      ).join("");
      chipsEl.innerHTML = allChip + catChips;

      chipsEl.addEventListener("click", e => {
        const btn = e.target.closest(".chip");
        if (!btn) return;
        chipsEl.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
        btn.classList.add("active");
        activeCategory = btn.dataset.cat;
        applyFilters();
      });

      document.getElementById("search").addEventListener("input", applyFilters);
      document.getElementById("authorFilter").addEventListener("change", applyFilters);
      document.getElementById("pubFilter").addEventListener("change", applyFilters);
      document.getElementById("sort").addEventListener("change", applyFilters);
      applyFilters();
    }

    init();
  </script>
</body>
</html>
